<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS 一键同步终端</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #131c2e;
            --primary: #38bdf8;
            --success: #10b981;
            --warn: #f59e0b;
            --danger: #ef4444;
            --text-main: #f1f5f9;
            --text-sub: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            user-select: none;
        }

        .header { text-align: center; }
        .header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.5px; }
        .header p { font-size: 0.8rem; color: var(--text-sub); margin-top: 6px; }

        /* 核心中央大按钮 */
        .btn-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            color: var(--primary);
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }
        .action-btn:active {
            transform: scale(0.96);
        }
        .action-btn svg {
            width: 44px;
            height: 44px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            transition: all 0.3s ease;
        }

        /* 状态呼吸光环 */
        .ring {
            position: absolute;
            width: 216px;
            height: 216px;
            border-radius: 50%;
            border: 2px dashed rgba(56, 189, 248, 0.3);
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .busy .ring {
            border-color: var(--warn);
            animation: spin 3s linear infinite;
        }
        .busy .action-btn {
            color: var(--warn);
            border-color: var(--warn);
        }
        .success .ring {
            border-color: var(--success);
            transform: scale(1.05);
        }
        .success .action-btn {
            color: var(--success);
            border-color: var(--success);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* 状态与数据展示面板 */
        .status-box {
            width: 100%;
            max-width: 320px;
            background: var(--card-bg);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 14px 16px;
            text-align: center;
        }
        .status-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }
        .status-detail {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-family: monospace;
        }

        .footer {
            font-size: 0.75rem;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PCB 指向罗盘</h1>
        <p>BLE GPS 一键注入终端</p>
    </div>

    <!-- 交互主体 -->
    <div class="btn-wrapper" id="btnWrapper">
        <div class="ring"></div>
        <button class="action-btn" id="mainBtn" onclick="handleOneKeySync()">
            <svg viewBox="0 0 24 24">
                <path d="M12 2v20M2 12h20M12 2l4 4M12 2L8 6"/>
            </svg>
            <span id="btnLabel">一键同步</span>
        </button>
    </div>

    <!-- 状态反馈 -->
    <div class="status-box">
        <div class="status-text" id="statusText">就绪</div>
        <div class="status-detail" id="statusDetail">点击上方按钮，全自动定位并同步</div>
    </div>

    <div class="footer">首次需弹窗授权，后续自动静默重连</div>

    <script>
        const SERVICE_UUID = '254fcd40-dd2b-4a69-be19-cbe488847aba';
        const CHAR_UUID    = 'c25e9d8c-3d56-4bb6-b1c4-8e9acbebef9c';

        let isRunning = false;

        // UI 状态调度器
        function setUiState(state, text, detail) {
            const wrapper = document.getElementById('btnWrapper');
            const btnLabel = document.getElementById('btnLabel');
            const statusText = document.getElementById('statusText');
            const statusDetail = document.getElementById('statusDetail');

            wrapper.className = 'btn-wrapper ' + state;
            statusText.innerText = text;
            statusDetail.innerText = detail || '';

            if (state === 'busy') {
                btnLabel.innerText = '同步中...';
            } else if (state === 'success') {
                btnLabel.innerText = '已送达';
            } else {
                btnLabel.innerText = '一键同步';
            }
        }

        // 1. 获取手机 GPS 定位 (包装为 Promise)
        function getPhoneGps() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    return reject(new Error('浏览器不支持定位 API'));
                }
                navigator.geolocation.getCurrentPosition(
                    pos => resolve({
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        acc: pos.coords.accuracy
                    }),
                    err => reject(new Error(`GPS 定位失败(${err.code}): ${err.message}`)),
                    {
                        enableHighAccuracy: true,
                        timeout: 8000,
                        maximumAge: 0
                    }
                );
            });
        }

        // 2. 获取设备：优先检查历史已配对设备，没有才调起弹窗
        async function getBleDevice() {
            if (!navigator.bluetooth) {
                throw new Error('当前浏览器不支持 Web Bluetooth，请使用 Android Chrome');
            }

            // 核心特性：查询已授权设备，实现免弹窗静默重连
            if (navigator.bluetooth.getDevices) {
                const pairedDevices = await navigator.bluetooth.getDevices();
                if (pairedDevices.length > 0) {
                    // 取最近配对的设备
                    return pairedDevices[0];
                }
            }

            // 首次使用或未授权过：唤醒系统选择抽屉
            return await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID]
            });
        }

        // 3. 一键核心控制流程
        async function handleOneKeySync() {
            if (isRunning) return;
            isRunning = true;

            const mainBtn = document.getElementById('mainBtn');
            mainBtn.disabled = true;

            try {
                setUiState('busy', '正在连接并定位...', '启动 GPS 引擎并寻路蓝牙');

                // 核心并发执行：避免 GPS 延迟导致 Web Bluetooth 用户手势超时失效
                const gpsTask = getPhoneGps();
                const deviceTask = getBleDevice();

                // 阶段 1: 建立蓝牙链路
                const device = await deviceTask;
                setUiState('busy', '建立 GATT 通道...', `目标设备: ${device.name || '未知设备'}`);
                
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const char = await service.getCharacteristic(CHAR_UUID);

                // 阶段 2: 汇总 GPS 经纬度
                setUiState('busy', '锁定 GPS 坐标...', '正在同步高精度经纬度数据');
                const gps = await gpsTask;

                // 阶段 3: 打包 Float32 数据 (8 字节: 4B lat + 4B lon, 小端序)
                const buffer = new ArrayBuffer(8);
                const view = new DataView(buffer);
                view.setFloat32(0, gps.lat, true);
                view.setFloat32(4, gps.lon, true);

                // 阶段 4: 写入特征值
                if (char.writeValueWithoutResponse) {
                    await char.writeValueWithoutResponse(buffer);
                } else {
                    await char.writeValue(buffer);
                }

                // 阶段 5: 成功反馈 (固件会自行 disconnect 并触发跑马灯)
                setUiState('success', '同步成功！板子已启动跑马灯', `坐标: ${gps.lat.toFixed(5)}, ${gps.lon.toFixed(5)} (精度 ±${gps.acc.toFixed(0)}m)`);

            } catch (err) {
                console.error(err);
                setUiState('danger', '同步中断', err.message);
            } finally {
                isRunning = false;
                mainBtn.disabled = false;
                // 5 秒后自动复位为待命状态
                setTimeout(() => {
                    if (!isRunning) {
                        setUiState('normal', '就绪', '点击上方按钮，全自动定位并同步');
                    }
                }, 5000);
            }
        }
    </script>
</body>
</html>
